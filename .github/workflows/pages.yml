name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore optional 3D model release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p public
          if gh release view model-assets --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release download model-assets --repo "$GITHUB_REPOSITORY" --pattern sewageModel.glb --dir public --clobber; then
              python - <<'PY'
          from pathlib import Path
          p = Path('public/sewageModel.glb')
          with p.open('rb') as f:
              magic = f.read(4)
          if magic != b'glTF':
              raise SystemExit('sewageModel.glb is not a binary glTF (GLB) file')
          print(f'Validated sewageModel.glb: {p.stat().st_size} bytes')
          PY
            else
              echo "::notice::model-assets release exists but sewageModel.glb is not uploaded yet."
            fi
          else
            echo "::notice::model-assets release does not exist yet; deploying without the optional GLB."
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

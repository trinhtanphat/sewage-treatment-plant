name: Recover upstream sewage model

on:
  push:
    branches: [chore/model-release-assets]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe and recover author-hosted model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          mkdir -p recovered
          urls=(
            "http://211.143.122.110:18062/model/sewage.glb"
            "https://211.143.122.110:18062/model/sewage.glb"
            "http://211.143.122.110:18062/model/sewageModel.glb"
            "http://211.143.122.110:18062/sewage.glb"
            "http://211.143.122.110:18062/sewageModel.glb"
          )

          found_url=""
          for url in "${urls[@]}"; do
            echo "Probing ${url}"
            rm -f recovered/probe.bin
            if curl --fail --location \
              --connect-timeout 12 --max-time 25 \
              -H "Range: bytes=0-3" \
              -A "Mozilla/5.0" \
              -o recovered/probe.bin "${url}"; then
              magic=$(head -c 4 recovered/probe.bin | od -An -t x1 | tr -d ' \n')
              echo "Probe magic=${magic}"
              if [[ "${magic}" == "676c5446" ]]; then
                found_url="${url}"
                break
              fi
            fi
          done

          if [[ -z "${found_url}" ]]; then
            echo "No author-hosted URL returned binary glTF magic."
            exit 2
          fi

          echo "Valid GLB endpoint found: ${found_url}"
          curl --fail --location --retry 3 --retry-delay 3 \
            --connect-timeout 20 --max-time 900 \
            -A "Mozilla/5.0" \
            -o recovered/sewageModel.glb "${found_url}"

          size=$(stat -c '%s' recovered/sewageModel.glb)
          magic=$(head -c 4 recovered/sewageModel.glb | od -An -t x1 | tr -d ' \n')
          echo "Full download size=${size}; magic=${magic}"
          [[ "${magic}" == "676c5446" ]]
          [[ "${size}" -gt 1048576 ]]
          sha256sum recovered/sewageModel.glb

          gh release upload model-assets recovered/sewageModel.glb \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Preserve recovered model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sewageModel-recovered
          path: recovered/sewageModel.glb
          if-no-files-found: error
